name: Publish Shinwa dictionary update

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Windows側GitHub Releaseタグ"
        required: true
        type: string
      source_commit:
        description: "Releaseに対応する完全な40文字コミットSHA"
        required: true
        type: string
  repository_dispatch:
    types: [dictionary_update_requested]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shinwa-dictionary-publication
  cancel-in-progress: false

jobs:
  validate-sign-and-publish:
    name: Verify Release, sign manifest, and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out update publisher
        uses: actions/checkout@v4
        with:
          path: publisher
          fetch-depth: 0

      - name: Resolve fixed Release
        id: source
        env:
          WORKFLOW_TAG: ${{ inputs.source_tag }}
          WORKFLOW_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_TAG: ${{ github.event.client_payload.source_tag }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          SOURCE_TAG="${WORKFLOW_TAG:-$DISPATCH_TAG}"
          SOURCE_COMMIT="${WORKFLOW_COMMIT:-$DISPATCH_COMMIT}"
          [[ "$SOURCE_TAG" =~ ^dictionary-update-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]] || { echo "invalid source_tag"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_commit must be a full 40-character SHA"; exit 1; }
          echo "tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=${SOURCE_COMMIT,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          repository: SAXOPHOENIX/shinwa-speech-dictionary-lab
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.SHINWA_DICTIONARY_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Confirm tag and commit are identical
        working-directory: source
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --depth=1 origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          test "$(git rev-list -n 1 "$SOURCE_TAG")" = "$SOURCE_COMMIT"

      - name: Download fixed GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.SHINWA_DICTIONARY_SOURCE_TOKEN }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          mkdir -p release-assets
          gh release view "$SOURCE_TAG" --repo SAXOPHOENIX/shinwa-speech-dictionary-lab --json targetCommitish --jq .targetCommitish | grep -Fx "$SOURCE_COMMIT"
          gh release download "$SOURCE_TAG" --repo SAXOPHOENIX/shinwa-speech-dictionary-lab --dir release-assets \
            --pattern hotwords.json \
            --pattern contextual_corrections.json \
            --pattern automatic_corrections.json \
            --pattern update_manifest.json \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sig \
            --pattern update-public-key.pem

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publisher tests
        working-directory: publisher
        run: |
          python -m pip install pytest
          pytest -q

      - name: Verify signed Windows Release
        run: python publisher/scripts/verify_source_release.py --release-dir release-assets

      - name: Prepare isolated Pages publication
        env:
          SIGNING_KEY: ${{ secrets.SHINWA_DICTIONARY_SIGNING_KEY }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test -n "$SIGNING_KEY" || { echo "SHINWA_DICTIONARY_SIGNING_KEY is required"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/dictionary_ed25519_private.pem"
          mkdir -p staging-docs
          cp -a publisher/docs/. staging-docs/
          python publisher/scripts/publish_dictionary.py \
            --release-dir release-assets \
            --docs staging-docs \
            --private-key "$RUNNER_TEMP/dictionary_ed25519_private.pem" \
            --source-tag "$SOURCE_TAG" \
            --source-commit "$SOURCE_COMMIT"
          python publisher/scripts/verify_release.py --docs staging-docs

      - name: Update public files only after every check passes
        working-directory: publisher
        run: rsync -a --delete ../staging-docs/ docs/

      - name: Commit validated public files
        working-directory: publisher
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          git config user.name "shinwa-update-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs
          git diff --cached --quiet && { echo "No publication changes"; exit 1; }
          git commit -m "Publish $SOURCE_TAG"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publisher/docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

