name: Publish Shinwa dictionary update

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "教育リポジトリの完全な40文字コミットSHA"
        required: true
        type: string
  repository_dispatch:
    types: [dictionary_update_requested]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shinwa-dictionary-publication
  cancel-in-progress: false

jobs:
  validate-sign-and-publish:
    name: Validate, sign, and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out update publisher
        uses: actions/checkout@v4
        with:
          path: publisher
          fetch-depth: 0

      - name: Resolve fixed source commit
        id: source
        env:
          WORKFLOW_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          SOURCE_COMMIT="${WORKFLOW_COMMIT:-$DISPATCH_COMMIT}"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_commit must be a full 40-character SHA"; exit 1; }
          echo "commit=${SOURCE_COMMIT,,}" >> "$GITHUB_OUTPUT"

      - name: Check out the exact education commit
        uses: actions/checkout@v4
        with:
          repository: SAXOPHOENIX/shinwa-speech-dictionary-lab
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.SHINWA_DICTIONARY_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Confirm source did not move
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publisher tests
        working-directory: publisher
        run: |
          python -m pip install pytest
          pytest -q

      - name: Prepare isolated publication
        env:
          SIGNING_KEY: ${{ secrets.SHINWA_DICTIONARY_SIGNING_KEY }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test -n "$SIGNING_KEY" || { echo "SHINWA_DICTIONARY_SIGNING_KEY is required"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/dictionary_ed25519_private.pem"
          mkdir -p staging-docs
          cp -a publisher/docs/. staging-docs/
          python publisher/scripts/publish_dictionary.py \
            --source-root source \
            --docs staging-docs \
            --private-key "$RUNNER_TEMP/dictionary_ed25519_private.pem" \
            --source-commit "$SOURCE_COMMIT"
          python publisher/scripts/verify_release.py --docs staging-docs

      - name: Update public files only after every check passes
        working-directory: publisher
        run: rsync -a --delete ../staging-docs/ docs/

      - name: Commit validated public files
        working-directory: publisher
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          git config user.name "shinwa-update-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs
          git diff --cached --quiet && { echo "No publication changes"; exit 1; }
          VERSION=$(python -c "import json; print(json.load(open('docs/v1/dictionaries/generated_ja_manifest.json'))['version'])")
          git commit -m "Publish dictionary update v$VERSION from ${SOURCE_COMMIT:0:12}"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publisher/docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

